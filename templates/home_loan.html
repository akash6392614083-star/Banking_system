```html
<!DOCTYPE html>
<html>
<head>
    <title>Home Loan Application</title>
</head>

<body>

    <h1>Home Loan Application</h1>

    <form method="POST" action="/home-loan">

        <label>Age:</label>
        <input type="number" name="Age" required><br><br>

        <label>Occupation:</label>
        <input type="text" name="Occupation" required><br><br>

        <label>Employment Type:</label>
        <input type="text" name="Employment_Type" required><br><br>

        <label>Monthly Income:</label>
        <input type="number" name="Monthly_Income" required><br><br>

        <label>Employment/Business Duration:</label>
        <input type="number" step="0.1" name="Employment_Business_Duration" required><br><br>

        <label>Existing Monthly EMI:</label>
        <input type="number" name="Existing_Monthly_EMI" required><br><br>

        <label>Loan Amount:</label>
        <input type="number" name="Loan_Amount" required><br><br>

        <label>Loan Tenure:</label>
        <input type="number" name="Loan_Tenure" required><br><br>

        <label>Property Value:</label>
        <input type="number" name="Property_Value" required><br><br>

        <label>Down Payment:</label>
        <input type="number" name="Down_Payment" required><br><br>

        <label>Property Type:</label>
        <input type="text" name="Property_Type" required><br><br>

        <label>Property Location Type:</label>
        <input type="text" name="Property_Location_Type" required><br><br>

        <label>Number of Dependents:</label>
        <input type="number" name="Number_of_Dependents" required><br><br>

        <button type="submit">Check Loan Eligibility</button>

    </form>

</body>
</html>
```
