<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --deep-navy: #0B1F3A;
        --royal-blue: #1E4D8F;
        --soft-gold: #D4AF37;
        --bg: #F5F7FA;
        --white: #FFFFFF;
        --text-primary: #172033;
        --text-secondary: #667085;
        --border: #E4E7EC;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text-primary);
    }

    .page-shell {
        max-width: 560px;
        margin: 0 auto;
        padding: 48px 24px 64px;
    }

    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--text-secondary);
        text-decoration: none;
        margin-bottom: 28px;
        transition: color 0.15s ease;
    }

    .back-link:hover {
        color: var(--royal-blue);
    }

    .back-link:focus-visible {
        outline: 2px solid var(--royal-blue);
        outline-offset: 3px;
        border-radius: 4px;
    }

    .page-header {
        margin-bottom: 28px;
    }

    .page-header h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--deep-navy);
    }

    .page-header p {
        margin: 0;
        font-size: 15px;
        color: var(--text-secondary);
    }

    /* Balance card */
    .balance-card {
        background: linear-gradient(135deg, var(--deep-navy) 0%, var(--royal-blue) 100%);
        border-radius: 16px;
        padding: 28px 28px;
        margin-bottom: 20px;
        box-shadow: 0 8px 20px rgba(11, 31, 58, 0.18);
        position: relative;
        overflow: hidden;
    }

    .balance-card::after {
        content: "";
        position: absolute;
        top: -40px;
        right: -40px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: rgba(212, 175, 55, 0.12);
    }

    .balance-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.7);
        margin: 0 0 10px;
        position: relative;
        z-index: 1;
    }

    .balance-amount {
        font-size: 34px;
        font-weight: 800;
        color: var(--white);
        letter-spacing: -0.02em;
        position: relative;
        z-index: 1;
    }

    /* Form card */
    .form-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06);
        margin-bottom: 20px;
    }

    .form-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    .amount-field {
        position: relative;
        margin-bottom: 24px;
    }

    .amount-field .currency-prefix {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 16px;
        font-weight: 600;
        color: var(--text-secondary);
        pointer-events: none;
    }

    .amount-field input[type="number"] {
        width: 100%;
        padding: 14px 16px 14px 34px;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        color: var(--text-primary);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    .amount-field input[type="number"]:focus {
        outline: none;
        border-color: var(--royal-blue);
        background: var(--white);
        box-shadow: 0 0 0 3px rgba(30, 77, 143, 0.14);
    }

    .amount-field input[type="number"]::-webkit-outer-spin-button,
    .amount-field input[type="number"]::-webkit-inner-spin-button {
        opacity: 1;
    }

    .submit-btn {
        width: 100%;
        padding: 14px 20px;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--white);
        background: var(--deep-navy);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.05s ease;
    }

    .submit-btn:hover {
        background: var(--royal-blue);
    }

    .submit-btn:active {
        transform: translateY(1px);
    }

    .submit-btn:focus-visible {
        outline: 2px solid var(--soft-gold);
        outline-offset: 2px;
    }

    /* Info card */
    .info-card {
        display: flex;
        gap: 14px;
        align-items: flex-start;
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px 22px;
    }

    .info-icon {
        flex-shrink: 0;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(30, 77, 143, 0.08);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .info-icon svg {
        width: 20px;
        height: 20px;
        stroke: var(--royal-blue);
    }

    .info-text h3 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
    }

    .info-text p {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    @media (max-width: 480px) {
        .page-shell {
            padding: 32px 16px 48px;
        }

        .page-header h1 {
            font-size: 24px;
        }

        .balance-card,
        .form-card {
            padding: 22px;
        }

        .balance-amount {
            font-size: 28px;
        }
    }
</style>
</head>

<body>

    <div class="page-shell">

        <a href="/dashboard" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back to Dashboard
        </a>

        <div class="page-header">
            <h1>Deposit Money</h1>
            <p>Add funds to your SecureBank account securely.</p>
        </div>

        <div class="balance-card">
            <p class="balance-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="5" width="20" height="14" rx="2"/>
                    <line x1="2" y1="10" x2="22" y2="10"/>
                </svg>
                Current Balance
            </p>
            <div class="balance-amount">₹{{ balance }}</div>
        </div>

        <div class="form-card">
            <form action="/deposite" method="POST">

                <label for="amount">Deposit Amount</label>
                <div class="amount-field">
                    <span class="currency-prefix">₹</span>
                    <input
                        type="number"
                        id="amount"
                        name="amount"
                        min="1"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>

                <button type="submit" class="submit-btn">Deposit Money</button>

            </form>
        </div>

        <div class="info-card">
            <div class="info-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                </svg>
            </div>
            <div class="info-text">
                <h3>Secure Deposit</h3>
                <p>Enter the amount you would like to add to your account.</p>
            </div>
        </div>

    </div>

</body>
</html>
