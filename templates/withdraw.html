<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    :root {
        --navy: #0B1F3A;
        --royal-blue: #1E4D8F;
        --gold: #D4AF37;
        --bg: #F5F7FA;
        --white: #FFFFFF;
        --text-primary: #172033;
        --text-secondary: #667085;
        --border: #E4E7EC;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: var(--bg);
        color: var(--text-primary);
    }

    .page {
        max-width: 520px;
        margin: 0 auto;
        padding: 48px 24px 64px;
    }

    /* Header */
    .page-header {
        margin-bottom: 28px;
    }

    .page-header h1 {
        margin: 0 0 6px;
        font-size: 26px;
        font-weight: 700;
        color: var(--navy);
        letter-spacing: -0.02em;
    }

    .page-header p {
        margin: 0;
        font-size: 15px;
        color: var(--text-secondary);
        line-height: 1.5;
    }

    /* Balance card */
    .balance-card {
        background: linear-gradient(135deg, var(--navy) 0%, var(--royal-blue) 100%);
        border-radius: 14px;
        padding: 24px 28px;
        margin-bottom: 24px;
        color: var(--white);
        box-shadow: 0 8px 20px rgba(11, 31, 58, 0.18);
    }

    .balance-card .label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.75);
        margin-bottom: 8px;
    }

    .balance-card .label svg {
        flex-shrink: 0;
    }

    .balance-card .amount {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--gold);
    }

    /* Form card */
    .form-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 28px;
        margin-bottom: 20px;
        box-shadow: 0 1px 2px rgba(23, 32, 51, 0.04);
    }

    .form-card label {
        display: block;
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
    }

    .amount-input-wrap {
        position: relative;
        margin-bottom: 20px;
    }

    .amount-input-wrap .currency {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-secondary);
        font-size: 16px;
        font-weight: 500;
        pointer-events: none;
    }

    .form-card input[type="number"] {
        width: 100%;
        padding: 14px 16px 14px 34px;
        font-size: 16px;
        font-family: 'Inter', sans-serif;
        color: var(--text-primary);
        background: var(--bg);
        border: 1.5px solid var(--border);
        border-radius: 10px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .form-card input[type="number"]:focus {
        border-color: var(--navy);
        background: var(--white);
        box-shadow: 0 0 0 3px rgba(11, 31, 58, 0.1);
    }

    .form-card input[type="number"]::-webkit-outer-spin-button,
    .form-card input[type="number"]::-webkit-inner-spin-button {
        opacity: 1;
    }

    .submit-btn {
        width: 100%;
        padding: 14px 20px;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 600;
        color: var(--white);
        background-color: var(--navy);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background-color 0.15s ease, transform 0.05s ease;
    }

    .submit-btn:hover {
        background-color: var(--royal-blue);
    }

    .submit-btn:active {
        transform: translateY(1px);
    }

    /* Info card */
    .info-card {
        display: flex;
        gap: 12px;
        background: var(--white);
        border: 1px solid var(--border);
        border-left: 3px solid var(--gold);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 28px;
    }

    .info-card svg {
        flex-shrink: 0;
        margin-top: 2px;
    }

    .info-card .info-title {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--text-primary);
        margin: 0 0 3px;
    }

    .info-card .info-text {
        font-size: 13.5px;
        color: var(--text-secondary);
        margin: 0;
        line-height: 1.5;
    }

    /* Back link */
    .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 500;
        color: var(--royal-blue);
        text-decoration: none;
    }

    .back-link:hover {
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .page {
            padding: 32px 16px 48px;
        }

        .page-header h1 {
            font-size: 22px;
        }

        .balance-card {
            padding: 20px 22px;
        }

        .balance-card .amount {
            font-size: 28px;
        }

        .form-card {
            padding: 22px;
        }
    }
</style>
</head>
<body>

<div class="page">

    <div class="page-header">
        <h1>Withdraw Money</h1>
        <p>Withdraw funds securely from your SecureBank account.</p>
    </div>

    <div class="balance-card">
        <div class="label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <rect x="2" y="6" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M2 10H22" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="17" cy="15" r="1.4" fill="currentColor"/>
            </svg>
            Available Balance
        </div>
        <div class="amount">₹{{ balance }}</div>
    </div>

    <div class="form-card">
        <form action="/withdraw" method="POST">

            <label for="amount">Withdrawal Amount</label>

            <div class="amount-input-wrap">
                <span class="currency">₹</span>
                <input
                    type="number"
                    id="amount"
                    name="amount"
                    min="1"
                    step="0.01"
                    required
                    placeholder="0.00"
                >
            </div>

            <button type="submit" class="submit-btn">Withdraw Money</button>

        </form>
    </div>

    <div class="info-card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="#D4AF37" stroke-width="1.8"/>
            <path d="M12 8V13" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round"/>
            <circle cx="12" cy="16.2" r="1" fill="#D4AF37"/>
        </svg>
        <div>
            <p class="info-title">Before you withdraw</p>
            <p class="info-text">Make sure you have sufficient available balance before submitting your withdrawal.</p>
        </div>
    </div>

    <a href="/dashboard" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back to Dashboard
    </a>

</div>

</body>
</html>
