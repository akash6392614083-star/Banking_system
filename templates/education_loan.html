```html
<!DOCTYPE html>
<html>
<head>
    <title>Education Loan Application</title>
</head>

<body>

    <h1>Education Loan Application</h1>

    <form method="POST" action="/education-loan">

        <label>Age:</label>
        <input type="number" name="Age" required><br><br>

        <label>Education Level:</label>
        <input type="text" name="Education_Level" required><br><br>

        <label>Course Type:</label>
        <input type="text" name="Course_Type" required><br><br>

        <label>Course Duration:</label>
        <input type="number" step="0.1" name="Course_Duration" required><br><br>

        <label>Institution Type:</label>
        <input type="text" name="Institution_Type" required><br><br>

        <label>Institution Location:</label>
        <input type="text" name="Institution_Location" required><br><br>

        <label>Admission Status:</label>
        <input type="text" name="Admission_Status" required><br><br>

        <label>Annual Course Fee:</label>
        <input type="number" name="Annual_Course_Fee" required><br><br>

        <label>Total Education Cost:</label>
        <input type="number" name="Total_Education_Cost" required><br><br>

        <label>Loan Amount:</label>
        <input type="number" name="Loan_Amount" required><br><br>

        <label>Family Monthly Income:</label>
        <input type="number" name="Family_Monthly_Income" required><br><br>

        <label>Family Existing EMI:</label>
        <input type="number" name="Family_Existing_EMI" required><br><br>

        <label>Number of Dependents:</label>
        <input type="number" name="Number_of_Dependents" required><br><br>

        <label>Previous Academic Performance:</label>
        <input type="text" name="Previous_Academic_Performance" required><br><br>

        <label>Co-Applicant Occupation:</label>
        <input type="text" name="Co_Applicant_Occupation" required><br><br>

        <label>Co-Applicant Monthly Income:</label>
        <input type="number" name="Co_Applicant_Monthly_Income" required><br><br>

        <button type="submit">Check Loan Eligibility</button>

    </form>

</body>
</html>
