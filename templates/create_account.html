<!DOCTYPE html>
<html>

<head>
    <title>Create Bank Account</title>
</head>

<body>

    <h1>Create Bank Account</h1>

    <form action="/create-account" method="POST">

        <!-- Account Type -->

        <label>Account Type:</label>

        <select name="account_type" required>

            <option value="">
                Select Account Type
            </option>

            <option value="Savings">
                Savings Account
            </option>

            <option value="Current">
                Current Account
            </option>

        </select>

        <br><br>


        <!-- Date of Birth -->

        <label>Date of Birth:</label>

        <input
            type="date"
            name="date_of_birth"
            required
        >

        <br><br>


        <!-- Gender -->

        <label>Gender:</label>

        <select name="gender" required>

            <option value="">
                Select Gender
            </option>

            <option value="Male">
                Male
            </option>

            <option value="Female">
                Female
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <br><br>


        <!-- Address -->

        <label>Address:</label>

        <br>

        <textarea
            name="address"
            rows="4"
            cols="40"
            required
        ></textarea>

        <br><br>


        <!-- City -->

        <label>City:</label>

        <input
            type="text"
            name="city"
            required
        >

        <br><br>


        <!-- State -->

        <label>State:</label>

        <input
            type="text"
            name="state"
            required
        >

        <br><br>


        <!-- PIN Code -->

        <label>PIN Code:</label>

        <input
            type="text"
            name="pincode"
            maxlength="6"
            pattern="[0-9]{6}"
            required
        >

        <br><br>


        <!-- Occupation -->

        <label>Occupation:</label>

        <select name="occupation" required>

            <option value="">
                Select Occupation
            </option>

            <option value="Salaried">
                Salaried
            </option>

            <option value="Self Employed">
                Self Employed
            </option>

            <option value="Business">
                Business
            </option>

            <option value="Student">
                Student
            </option>

            <option value="Retired">
                Retired
            </option>

            <option value="Other">
                Other
            </option>

        </select>

        <br><br>


        <!-- Initial Deposit -->

        <label>Initial Deposit:</label>

        <input
            type="number"
            name="initial_deposit"
            min="0"
            step="0.01"
            value="0"
            required
        >

        <br><br>


        <button type="submit">
            Create Bank Account
        </button>

    </form>

    <br>

    <a href="/dashboard">
        Back to Dashboard
    </a>

</body>

</html>
