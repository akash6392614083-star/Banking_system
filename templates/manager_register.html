<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureBank - Manager Registration</title>
</head>

<body>

    <header>

        <h2>SecureBank</h2>

        <nav>
            <a href="/manager">Manager Home</a>
            <a href="/manager-login">Manager Login</a>
        </nav>

    </header>

    <hr>

    <main>

        <h1>Manager Registration</h1>

        <p>Create your SecureBank manager account.</p>

        <form method="POST" action="/manager-register">

            <label>Full Name:</label>
            <br>
            <input type="text" name="full_name" required>

            <br><br>

            <label>Email:</label>
            <br>
            <input type="email" name="email" required>

            <br><br>

            <label>Password:</label>
            <br>
            <input type="password" name="password" required>

            <br><br>

            <button type="submit">Register</button>

        </form>

        <br>

        <p>
            Already have a manager account?
            <a href="/manager-login">Login here</a>
        </p>

    </main>

    <hr>

    <footer>

        <p>SecureBank Manager Portal</p>

    </footer>

</body>

</html>
