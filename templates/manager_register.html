<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureBank - Manager Registration</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #0B1F3A;
            --royal: #1E4D8F;
            --gold: #D4AF37;
            --bg: #F5F7FA;
            --white: #FFFFFF;
            --text: #172033;
            --text-secondary: #667085;
            --border: #E4E7EC;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        header {
            background: var(--navy);
            padding: 18px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h2 {
            color: var(--white);
            margin: 0;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        header nav {
            display: flex;
            gap: 24px;
        }

        header nav a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 4px;
            border-bottom: 2px solid transparent;
            transition: color 0.15s ease, border-color 0.15s ease;
        }

        header nav a:hover {
            color: var(--white);
            border-bottom-color: var(--gold);
        }

        hr {
            display: none;
        }

        main {
            max-width: 480px;
            margin: 56px auto;
            padding: 0 20px;
        }

        .card {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
            padding: 40px;
        }

        .card h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 800;
            color: var(--navy);
        }

        .card > p {
            margin: 0 0 28px 0;
            color: var(--text-secondary);
            font-size: 14.5px;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .field input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            background: var(--white);
            font-family: inherit;
            font-size: 14px;
            color: var(--text);
        }

        .field input:focus {
            outline: none;
            border-color: var(--royal);
            box-shadow: 0 0 0 3px rgba(30, 77, 143, 0.12);
        }

        button[type="submit"] {
            width: 100%;
            background: linear-gradient(135deg, var(--navy), var(--royal));
            color: var(--white);
            border: none;
            border-radius: 10px;
            padding: 13px 20px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: filter 0.15s ease, transform 0.05s ease;
            margin-top: 4px;
        }

        button[type="submit"]:hover {
            filter: brightness(1.1);
        }

        button[type="submit"]:active {
            transform: translateY(1px);
        }

        .login-hint {
            text-align: center;
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 24px;
        }

        .login-hint a {
            color: var(--royal);
            font-weight: 600;
            text-decoration: none;
        }

        .login-hint a:hover {
            text-decoration: underline;
        }

        .notice {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 24px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .notice svg {
            flex-shrink: 0;
            margin-top: 1px;
        }

        footer {
            text-align: center;
            padding: 24px 20px 40px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        @media (max-width: 640px) {
            header {
                padding: 16px 20px;
            }

            main {
                margin: 32px auto;
            }

            .card {
                padding: 28px 22px;
            }

            .card h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header>

        <h2>SecureBank</h2>

        <nav>
            <a href="/manager">Manager Home</a>
            <a href="/manager-login">Manager Login</a>
        </nav>

    </header>

    <main>

        <div class="card">

            <h1>Manager Registration</h1>

            <p>Create your SecureBank manager account.</p>

            <div class="notice">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M12 2L4 5V11C4 16.55 7.36 21.74 12 23C16.64 21.74 20 16.55 20 11V5L12 2Z" stroke="#1E4D8F" stroke-width="1.6" stroke-linejoin="round"/>
                    <path d="M9 12L11 14L15.5 9.5" stroke="#1E4D8F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span>Your information is protected and used only for internal bank administration access.</span>
            </div>

            <form method="POST" action="/manager-register">

                <div class="field">
                    <label for="full_name">Full Name</label>
                    <input type="text" id="full_name" name="full_name" required placeholder="Enter your full name">
                </div>

                <div class="field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@securebank.com">
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Create a secure password">
                </div>

                <button type="submit">Register</button>

            </form>

            <p class="login-hint">
                Already have a manager account?
                <a href="/manager-login">Login here</a>
            </p>

        </div>

    </main>

    <footer>
        <p>SecureBank Manager Portal</p>
    </footer>

</body>

</html>
