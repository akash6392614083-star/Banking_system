<!DOCTYPE html>
<html>
<head>
    <title>Business Loan Application</title>
</head>

<body>

    <h1>Business Loan Application</h1>

    <form method="POST" action="/business-loan">

        <label>Applicant Age:</label>
        <input type="number" name="Applicant_Age" required><br><br>

        <label>Business Type:</label>
        <input type="text" name="Business_Type" required><br><br>

        <label>Business Age:</label>
        <input type="number" step="0.1" name="Business_Age" required><br><br>

        <label>Monthly Business Revenue:</label>
        <input type="number" name="Monthly_Business_Revenue" required><br><br>

        <label>Monthly Business Expenses:</label>
        <input type="number" name="Monthly_Business_Expenses" required><br><br>

        <label>Monthly Business Profit:</label>
        <input type="number" name="Monthly_Business_Profit" required><br><br>

        <label>Existing Business EMI:</label>
        <input type="number" name="Existing_Business_EMI" required><br><br>

        <label>Loan Amount:</label>
        <input type="number" name="Loan_Amount" required><br><br>

        <label>Loan Tenure:</label>
        <input type="number" name="Loan_Tenure" required><br><br>

        <label>Number of Employees:</label>
        <input type="number" name="Number_of_Employees" required><br><br>

        <label>Business Registration:</label>
        <input type="text" name="Business_Registration" required><br><br>

        <label>GST Registration:</label>
        <input type="text" name="GST_Registration" required><br><br>

        <label>Annual Turnover:</label>
        <input type="number" name="Annual_Turnover" required><br><br>

        <label>Business Location Type:</label>
        <input type="text" name="Business_Location_Type" required><br><br>

        <label>Loan Purpose:</label>
        <input type="text" name="Loan_Purpose" required><br><br>

        <label>Collateral Available:</label>
        <input type="text" name="Collateral_Available" required><br><br>

        <button type="submit">Check Loan Eligibility</button>

    </form>

</body>
</html>
